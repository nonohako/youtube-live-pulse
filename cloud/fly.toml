app = "live-pulse-stats-nonohako"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CHANNEL_IDS = "UCtKtCiaWRz-d3EZn2xd1mdA,UCWpY0eSJtyO-qNAPbKFRSSg"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
