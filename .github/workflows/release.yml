name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run build

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem -Path dist -Filter "LivePulse-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*.__uninstaller.exe" } |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not created."
          }

          $blockMap = "$($installer.FullName).blockmap"
          $latestYml = (Resolve-Path "dist/latest.yml").Path
          if (-not (Test-Path -LiteralPath $blockMap)) {
            throw "Installer block map was not created."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed."
            }
          }

          gh release upload $tag $installer.FullName $blockMap $latestYml --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release asset upload failed."
          }
